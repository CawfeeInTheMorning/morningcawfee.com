<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>The Collective ☕︎</title>
  <link rel="icon" href="../assets/icons/icon-red.png" type="image/png">
  <style>
@font-face{font-family:"BricolageGrotesque";src:url("../fonts/BricolageGrotesque.ttf") format("truetype");font-display:swap;font-style:normal;font-weight:100 900;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#000;color:#fff;font-family:'BricolageGrotesque',sans-serif;min-height:100%;scroll-behavior:smooth;overflow-x:hidden;overflow-anchor:none;}
/* Nav */
@keyframes mc-dot-drift{from{background-position:0 0;}to{background-position:10px 10px;}}
#mc-margin-left,#mc-margin-right{position:fixed;top:0;bottom:0;width:60px;background-color:#C3BEC4;background-image:radial-gradient(circle,#a3a1a3 1.5px,transparent 1.5px);background-size:10px 10px;animation:mc-dot-drift 3s linear infinite;z-index:99998;pointer-events:none;}
#mc-margin-left{left:0;box-shadow:inset -8px 0 12px -4px rgba(0,0,0,0.3);}
#mc-margin-right{right:0;box-shadow:inset 8px 0 12px -4px rgba(0,0,0,0.3);}
#mc-nav{position:fixed;top:0;left:0;width:100%;z-index:100000;background:rgba(0,0,0,0.9);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:flex-start;height:60px;border-bottom:1px solid rgba(255,255,255,0.08);font-family:'BricolageGrotesque',sans-serif;}
#mc-header-contents{display:flex;align-items:center;justify-content:space-between;width:min(1200px,calc(100% - 140px));margin:0 auto;}
#mc-nav .mc-logo img{height:50px;width:auto;display:block;transition:transform 0.3s ease;}
.mc-logo:hover img{transform:scale(1.08) rotate(-5deg);}
#mc-sublinks{display:flex;gap:2rem;list-style:none;margin:0;padding:0;}
#mc-sublinks>li>a{color:#fff;text-decoration:none;font-family:'BricolageGrotesque',sans-serif;font-size:14px;font-weight:500;letter-spacing:-0.01em;transition:color 0.2s ease;position:relative;}
#mc-sublinks>li>a::after{content:'';position:absolute;bottom:-2px;left:0;width:0;height:1px;background:#E81215;transition:width 0.25s ease;}
#mc-sublinks>li>a:hover{color:#E81215;}
#mc-sublinks>li>a:hover::after{width:100%;}
.mc-has-dropdown{position:relative;}
.mc-has-dropdown>a{display:inline-flex;align-items:center;gap:6px;}
.mc-dropdown-icon{width:22px;height:22px;display:block;filter:brightness(0) invert(1);opacity:1;flex-shrink:0;position:relative;top:1px;transition:filter 0.2s;}
#mc-sublinks .mc-has-dropdown:hover .mc-dropdown-icon{filter:invert(20%) sepia(100%) saturate(5000%) hue-rotate(340deg);}
#mc-sublinks .mc-has-dropdown:hover>a{color:#E81215;}
#mc-sublinks .mc-has-dropdown:hover>a::after{width:100%;}
.mc-nav-dropdown{position:absolute;top:calc(100% + 10px);left:-15px;background:#0a0a0a;border-radius:8px;padding:6px 0;min-width:160px;display:none;flex-direction:column;z-index:10000;backdrop-filter:blur(12px);}
.mc-nav-dropdown::before{content:'';position:absolute;top:-10px;left:0;right:0;height:10px;}
.mc-has-dropdown:hover .mc-nav-dropdown,.mc-has-dropdown.mc-dropdown-open .mc-nav-dropdown{display:flex;}
.mc-nav-dropdown a{color:rgba(255,255,255,0.8);text-decoration:none;font-family:'BricolageGrotesque',sans-serif;font-size:13px;font-weight:500;padding:8px 16px;white-space:nowrap;transition:color 0.15s;letter-spacing:-0.01em;text-align:left;}
#mc-sublinks .mc-nav-dropdown a:hover{color:#E81215;}
.mc-nav-dropdown a span{position:relative;}
.mc-nav-dropdown a span::after{content:'';position:absolute;bottom:-2px;left:0;width:0;height:1px;background:#E81215;transition:width 0.25s ease;}
#mc-sublinks .mc-nav-dropdown a:hover span::after{width:100%;}
#mc-sublinks .mc-has-dropdown.mc-dropdown-open>a{color:#E81215;}
#mc-sublinks .mc-has-dropdown.mc-dropdown-open>a::after{width:100%;}
#mc-sublinks .mc-has-dropdown.mc-dropdown-open .mc-dropdown-icon{filter:invert(20%) sepia(100%) saturate(5000%) hue-rotate(340deg);}
/* Main */
#mc-main{padding-top:60px;}
#mc-collective-images{display:flex;flex-direction:column;gap:10px;width:min(1200px,calc(100% - 140px));margin:0 auto;}
#mc-collective-images img{width:100%;display:block;}
/* Footer */
#mc-cinnabuns{position:absolute;left:var(--cin-x,0px);bottom:var(--cin-y,0px);transform:scale(var(--cin-scale,1));transform-origin:bottom right;pointer-events:none;z-index:10;}
#mc-cinnabuns-img{display:block;width:120px;height:auto;}
#footer{width:100%;background:#000;border-top:1px solid rgba(255,255,255,0.1);font-family:'BricolageGrotesque',sans-serif;}
#mc-footer-inner{display:flex;align-items:center;justify-content:space-between;width:min(1200px,calc(100% - 140px));margin:0 auto;padding:0;height:58px;}
.mc-footer-left{display:flex;align-items:center;gap:12px;}
.mc-footer-follow{font-size:13px;color:rgba(255,255,255,0.4);white-space:nowrap;}
.mc-footer-social{display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.4);transition:color 0.2s,transform 0.2s;}
.mc-footer-social svg,.mc-footer-social img{width:20px;height:20px;display:block;transition:transform 0.2s;}
.mc-footer-social img{filter:brightness(0) invert(1);opacity:0.4;}
.mc-footer-social:hover img{opacity:1;}
.mc-footer-social:hover{color:#E81215;}
.mc-footer-social:hover svg{transform:scale(1.2);}.mc-footer-social:hover img{transform:scale(1.2);filter:invert(20%) sepia(100%) saturate(5000%) hue-rotate(340deg);}
.mc-footer-center{position:absolute;left:50%;transform:translateX(-50%);}
.mc-footer-center a{font-size:13px;color:#0248aa;text-decoration:none;transition:color 0.2s;}
.mc-footer-center a:hover{color:#fff;}
.mc-footer-right{font-size:13px;color:rgba(255,255,255,0.4);white-space:nowrap;}
@media(max-width:480px){
  #mc-margin-left,#mc-margin-right{display:none!important;}
  li:has(a[href="/#mc-about"]),li:has(a[href="/#mc-clients"]){display:none!important;}
  #mc-header-contents{width:calc(100% - 60px)!important;}
  #mc-sublinks{gap:1rem!important;}
  #mc-sublinks li a{font-size:11px!important;}
  .mc-footer-left,.mc-footer-right{display:none!important;}
  #mc-footer-inner{justify-content:center!important;}
  #mc-cinnabuns{left:50%!important;right:auto!important;transform:translateX(-50%) scale(var(--cin-scale,1))!important;transform-origin:bottom center!important;}
}
  </style>
</head>

<script>
var dropdownParent=document.querySelector('.mc-has-dropdown');
if(dropdownParent){
  dropdownParent.querySelector(':scope>a').addEventListener('click',function(e){
    if(window.matchMedia('(max-width:480px)').matches){
      e.preventDefault();
      dropdownParent.classList.toggle('mc-dropdown-open');
    }
  });
  document.addEventListener('click',function(e){
    if(window.matchMedia('(max-width:480px)').matches&&!e.target.closest('.mc-has-dropdown')){
      dropdownParent.classList.remove('mc-dropdown-open');
    }
  });
}
</script>
<style>
#cr-gate-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:99999;display:none;align-items:center;justify-content:center;}
#cr-gate-overlay.active{display:flex;}
#cr-gate-popup{background:#111;border-radius:14px;padding:36px 40px;max-width:420px;width:calc(100% - 40px);text-align:center;font-family:'BricolageGrotesque',sans-serif;}
#cr-gate-popup p{font-size:22px;font-weight:700;color:#fff;margin-bottom:28px;line-height:1.3;}
#cr-gate-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
#cr-gate-yes{background:#679CBC;color:#fff;border:none;border-radius:8px;padding:10px 24px;font-family:'BricolageGrotesque',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:background 0.2s;}
#cr-gate-yes:hover{background:#5288aa;}
#cr-gate-no{background:transparent;color:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:10px 24px;font-family:'BricolageGrotesque',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:color 0.2s,border-color 0.2s;}
#cr-gate-no:hover{color:#fff;border-color:rgba(255,255,255,0.5);}
</style>
<div id="cr-gate-overlay">
  <div id="cr-gate-popup">
    <p>Are you a furry, or an artist?</p>
    <div id="cr-gate-btns">
      <button id="cr-gate-yes">Yep :3</button>
      <button id="cr-gate-no">No, send me back</button>
    </div>
  </div>
</div>
<script>
(function(){
  var overlay=document.getElementById('cr-gate-overlay');
  document.querySelectorAll('a[href="/charref/"]').forEach(function(a){
    a.addEventListener('click',function(e){e.preventDefault();overlay.classList.add('active');});
  });
  document.getElementById('cr-gate-yes').addEventListener('click',function(){window.location.href='/charref/';});
  document.getElementById('cr-gate-no').addEventListener('click',function(){overlay.classList.remove('active');});
  overlay.addEventListener('click',function(e){if(e.target===overlay)overlay.classList.remove('active');});
})();
</script>
