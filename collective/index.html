  <style>
@font-face{font-family:"BricolageGrotesque";src:url("../fonts/RMMono-Light.woff2") format("woff2");font-display:swap;font-weight:300}
@font-face{font-family:"BricolageGrotesque";src:url("../fonts/RMMono-Regular.woff2") format("woff2");font-display:swap;font-weight:400}
@font-face{font-family:"BricolageGrotesque";src:url("../fonts/RMMono-SemiBold.woff2") format("woff2");font-display:swap;font-weight:600}
@font-face{font-family:"BricolageGrotesque";src:url("../fonts/RMMono-Bold.woff2") format("woff2");font-display:swap;font-weight:700}
@font-face{font-family:"BricolageGrotesque";src:url("../fonts/RMMono-Black.woff2") format("woff2");font-display:swap;font-weight:900}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#000;color:#fff;font-family:'BricolageGrotesque',sans-serif;min-height:100%;scroll-behavior:smooth;}
/* Nav */
#mc-nav{position:fixed;top:0;left:0;width:100%;z-index:9999;background:rgba(0,0,0,0.9);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;height:60px;border-bottom:1px solid rgba(255,255,255,0.08);font-family:'BricolageGrotesque',sans-serif;}
#header{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:1200px;padding:0 20px;}
#mc-nav .mc-logo img{height:50px;width:auto;display:block;transition:transform 0.3s ease;}
.mc-logo:hover img{transform:scale(1.08) rotate(-5deg);}
#mc-nav ul{display:flex;gap:2rem;list-style:none;}
#mc-nav ul li a{color:#fff;text-decoration:none;font-size:14px;font-weight:500;letter-spacing:-0.01em;transition:color 0.2s;position:relative;}
#mc-nav ul li a::after{content:'';position:absolute;bottom:-2px;left:0;width:0;height:1px;background:#E81215;transition:width 0.25s;}
#mc-nav ul li a:hover{color:#E81215;}
#mc-nav ul li a:hover::after{width:100%;}
/* Main */
#mc-main{padding-top:60px;min-height:calc(100vh - 58px);display:flex;align-items:center;justify-content:center;}
.mc-page-placeholder{text-align:center;padding:80px 20px;}
.mc-page-placeholder h1{font-family:'BricolageGrotesque',sans-serif;font-size:48px;font-weight:700;color:#fff;margin-bottom:16px;}
.mc-page-placeholder p{font-size:16px;color:rgba(255,255,255,0.5);margin-bottom:32px;}
.mc-page-back{display:inline-block;padding:12px 28px;background:#4641a5;color:#fff;text-decoration:none;border-radius:8px;font-family:'BricolageGrotesque',sans-serif;font-size:14px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;transition:background 0.2s,transform 0.2s;}
.mc-page-back:hover{background:#332f7e;transform:scale(1.04);}
/* Footer */
#mc-cinnabuns{position:absolute;left:var(--cin-x,0px);bottom:var(--cin-y,0px);transform:scale(var(--cin-scale,1));transform-origin:bottom right;pointer-events:none;z-index:10;}
#mc-cinnabuns-img{display:block;width:120px;height:auto;}
#footer{width:100%;background:#000;border-top:1px solid rgba(255,255,255,0.1);}
#mc-footer-inner{display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto;padding:0 40px;height:58px;position:relative;overflow:visible;}
.mc-footer-left{display:flex;align-items:center;gap:12px;}
.mc-footer-follow{font-size:13px;color:rgba(255,255,255,0.4);white-space:nowrap;}
.mc-footer-social{display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.4);transition:color 0.2s,transform 0.2s;}
.mc-footer-social svg,.mc-footer-social img{width:20px;height:20px;display:block;transition:transform 0.2s,filter 0.2s;}
.mc-footer-social img{filter:brightness(0) invert(1);opacity:0.4;}
.mc-footer-social:hover img{opacity:1;}
.mc-footer-social:hover{color:#E81215;}
.mc-footer-social:hover svg,.mc-footer-social:hover img{transform:scale(1.2);filter:invert(20%) sepia(100%) saturate(5000%) hue-rotate(340deg);}
.mc-footer-center a{font-size:13px;color:#0248aa;text-decoration:none;transition:color 0.2s;}
.mc-footer-center a:hover{color:#fff;}
.mc-footer-right{font-size:13px;color:rgba(255,255,255,0.4);white-space:nowrap;}
  </style>
</head>
